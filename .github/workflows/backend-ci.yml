name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "config/architecture_import_baseline.json"
      - ".github/workflows/backend-ci.yml"
      - "infrastructure/ai/prompt_packages/**"
  pull_request:
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "config/architecture_import_baseline.json"
      - ".github/workflows/backend-ci.yml"
      - "infrastructure/ai/prompt_packages/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check architecture dependency baseline
        run: python scripts/analyze_architecture.py --check-baseline config/architecture_import_baseline.json

      - name: Run unit tests
        run: pytest tests/unit tests/dag -q --tb=short
        env:
          # 单测不需要真实 key，用占位值防止启动时报错
          ANTHROPIC_API_KEY: "test-placeholder"
          ARK_API_KEY: "test-placeholder"
